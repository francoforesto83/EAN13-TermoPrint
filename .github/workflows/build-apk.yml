name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory and Build APK
        run: |
          # Crea la carpeta www obligatoria para Capacitor
          mkdir -p www
          
          # Busca el archivo index.html en todo el repositorio y cópialo a www/
          find . -name "index.html" -not -path "./www/*" -not -path "./android/*" -exec cp {} www/ \;
          
          # Si por alguna razón no lo encuentra, crea uno básico de respaldo
          if [ ! -f "www/index.html" ]; then
            echo "<html><body><h1>EAN13 TermoPrint</h1></body></html>" > www/index.html
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init EAN13TermoPrint com.ean13.termoprint --web-dir www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
