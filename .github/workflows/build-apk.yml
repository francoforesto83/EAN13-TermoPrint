name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory and Build APK
        run: |
          mkdir -p www
          # Busca cualquier archivo html en la raíz y lo copia como index.html en www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            # Si tiene otro nombre, toma el primer archivo .html que encuentre
            cp *.html www/index.html || echo "No se encontró archivo HTML"
          fi
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init EAN13TermoPrint com.ean13.termoprint --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
